name: Verify storefront
on:
  pull_request:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
