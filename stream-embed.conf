# ---------------------------------------------------------------------------
# مصادر التضمين (embed) — الوسيط في /embed.php هو القارئ الوحيد لهذا الملف
# ---------------------------------------------------------------------------
# الصيغة:   <alias> = <origin>
#   alias  : اسم قصير يُستخدم في الرابط   /<alias>/...   (يجب أن يطابق
#            قاعدة إعادة التوجيه في .htaccess)
#   origin : أصل المصدر بلا شرطة أخيرة (https://host[:port])
#
# لماذا ملف منفصل؟
#   رابط مشغّل البث الخاص (نفق Cloudflare المؤقت) يتغير مع كل إعادة تشغيل،
#   وبفضله يبقى التعديل في سطر واحد هنا بدل البحث في HTML و PHP و CSP.
#   الصفحة (/player.html) تشير إلى /player/... فقط، فلا يظهر رابط النفق
#   في مصدر الصفحة ولا في رؤوس CSP.
#
# أمان: الوسيط لا يجلب إلا مضيفاً مسموحاً في allowed-domains.txt — مطابقاً
#       تماماً لمدخل فيها أو مضيفاً فرعياً له (بحد فاصل عند النقطة). لذلك يكفي
#       تسجيل نطاق النفق الأم (trycloudflare.com) مرة واحدة، ولا حاجة لتعديل
#       القائمة مع كل رابط نفق جديد.
# ---------------------------------------------------------------------------

player = https://happen-feof-occurring-impacts.trycloudflare.com
