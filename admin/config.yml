# =============================================================================
# Decap CMS Configuration
# يحدد: كيفية المصادقة، المجموعات، الحقول، المعاينة
# =============================================================================

# الإعدادات الأساسية
backend:
  name: git-gateway
  branch: main

# إذا كنت تستخدم Netlify:
# backend:
#   name: git-gateway
#   branch: main

# للتطوير المحلي:
# backend:
#   name: proxy
#   proxy_url: http://localhost:8081/api/v1

# الإعدادات العامة
site_url: https://streammasterstore.com
display_url: https://streammasterstore.com
logo_url: /icon-192.png
locale: ar

# وسائط الرفع (الصور)
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# مسارات البحث عند النشر
publish_mode: editorial_workflow # draft → ready → published

# =============================================================================
# المجموعات (Collections) - تطابق Astro Content Collections
# =============================================================================

collections:
  # ---------------------------------------------------------------------
  # 1. المدوّنة
  # ---------------------------------------------------------------------
  - name: "blog"
    label: "المدوّنة"
    label_singular: "مقال"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}" # يستخدم عنوان المقال كـ slug
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{publishedAt | date('YYYY-MM-DD')}}"
    sortable_fields: ["publishedAt", "title", "category"]
    view_groups:
      - label: "حسب السنة"
        field: "publishedAt"
    fields: &blog_fields
      - { label: "العنوان", name: "title", widget: "string", hint: "عنوان جذاب، 50-70 حرف مثاليًا لـ SEO" }
      - { label: "الوصف (Meta Description)", name: "description", widget: "text", hint: "يظهر في نتائج Google، 150-160 حرف" }
      - { label: "مقتطف", name: "excerpt", widget: "text", hint: "يظهر في بطاقة المقال، 100-200 حرف" }
      - { label: "تاريخ النشر", name: "publishedAt", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "تاريخ التحديث", name: "updatedAt", widget: "datetime", required: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "الكاتب", name: "author", widget: "string", default: "فريق ستريم ماستر" }
      - { label: "الفئة", name: "category", widget: "select", options: ["مراجعات", "أدلة", "أخبار", "مقارنات", "البطولات"] }
      - { label: "الوسوم", name: "tags", widget: "list", required: false, hint: "كل وسم يضغط SEO. مثل: IPTV، السعودية، 2026" }
      - { label: "الصورة الرئيسية", name: "image", widget: "image", required: false, allow_multiple: false, hint: "الصورة تظهر في بطاقة المقال والمشاركة على وسائل التواصل. الحد الأدنى 1280px عرض." }
      - { label: "وصف الصورة (alt)", name: "imageAlt", widget: "string", required: false, hint: "مهم لـ SEO وإمكانية الوصول" }
      - { label: "وقت القراءة (دقائق)", name: "readingTime", widget: "number", required: false, default: 5, value_type: "int", min: 1, max: 60 }
      - { label: "مقال مميز", name: "featured", widget: "boolean", default: false, hint: "المقالات المميزة تظهر في الصفحة الرئيسية" }
      - { label: "مسودة (لا تنشر)", name: "draft", widget: "boolean", default: false }
      - { label: "محتوى المقال", name: "body", widget: "markdown", hint: "يدعم Markdown كامل. استخدم ## للعناوين الفرعية." }

  # ---------------------------------------------------------------------
  # 2. السيرفرات
  # ---------------------------------------------------------------------
  - name: "servers"
    label: "السيرفرات"
    label_singular: "سيرفر"
    folder: "src/content/servers"
    create: true
    slug: "{{name}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{displayName}} — {{tagline}}"
    fields:
      - { label: "اسم (slug)", name: "name", widget: "select", options: ["falcon", "shark", "hulk", "aronium", "istar"], hint: "لا يمكن تغييره بعد النشر" }
      - { label: "اسم العرض", name: "displayName", widget: "string", hint: "مثل: فالكون" }
      - { label: "شعار قصير", name: "tagline", widget: "string", hint: "مثل: الأقوى. الأوضح. الأفضل." }
      - { label: "الأيقونة (emoji)", name: "icon", widget: "string", hint: "مثل: 🦅 - سطر واحد emoji" }
      - { label: "اللون", name: "color", widget: "select", options: ["red", "amber", "green", "blue", "purple"] }
      - { label: "الترتيب", name: "order", widget: "number", default: 1, value_type: "int", min: 1, max: 10 }
      - { label: "شارة (اختياري)", name: "badge", widget: "string", required: false, hint: "مثل: الأكثر طلباً، الأفضل للمباريات، جديد" }
      - label: "المواصفات"
        name: "specs"
        widget: "object"
        fields:
          - { label: "الجودة", name: "quality", widget: "string", hint: "مثل: حتى 8K، حتى 4K" }
          - { label: "الثبات (Uptime)", name: "uptime", widget: "string", hint: "مثل: 99.9%" }
          - { label: "عدد الأجهزة المتزامنة", name: "devices", widget: "number", value_type: "int", min: 1, max: 5 }
          - { label: "عدد القنوات", name: "channels", widget: "string", hint: "مثل: +15,000" }
          - { label: "مكتبة VOD", name: "vod", widget: "string", hint: "مثل: +50,000" }
          - { label: "Catch-up", name: "catchup", widget: "string", hint: "مثل: 7 أيام" }
      - { label: "مناسب لـ (جمهور)", name: "bestFor", widget: "list", hint: "مثل: أصحاب أجهزة 4K، محبي المباريات" }
      - { label: "المميزات الرئيسية", name: "features", widget: "list", hint: "5 مميزات رئيسية كحد أقصى" }
      - { label: "مسودة", name: "draft", widget: "boolean", default: false }
      - { label: "المحتوى الكامل", name: "body", widget: "markdown" }

  # ---------------------------------------------------------------------
  # 3. الصفحات الثابتة (الشروط، الخصوصية...)
  # ---------------------------------------------------------------------
  - name: "pages"
    label: "الصفحات الثابتة"
    label_singular: "صفحة"
    folder: "src/content/pages"
    create: false # لا تنشئ صفحات جديدة من اللوحة
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "الوصف", name: "description", widget: "text" }
      - { label: "تاريخ التحديث", name: "updatedAt", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "إظهار في الفوتر", name: "showInFooter", widget: "boolean", default: false }
      - { label: "مسودة", name: "draft", widget: "boolean", default: false }
      - { label: "المحتوى", name: "body", widget: "markdown" }

  # ---------------------------------------------------------------------
  # 4. إعدادات الموقع (أرقام التواصل، البريد، الروابط)
  # ---------------------------------------------------------------------
  - name: "settings"
    label: "⚙️ إعدادات الموقع"
    label_singular: "إعداد"
    description: "إعدادات التواصل والروابط العامة للموقع. التغيير هنا ينعكس في كل صفحات الموقع فورًا."
    files:
      - name: "site"
        label: "معلومات الموقع الأساسية"
        file: "src/data/site.json"
        description: "اسم الموقع، الأرقام، البريد، الروابط الاجتماعية، SEO الافتراضي، روابط التنقل."
        fields:
          # المعلومات الأساسية
          - { label: "📋 اسم الموقع (عربي)", name: "name", widget: "string", hint: "مثل: ستريم ماستر برو" }
          - { label: "📋 اسم الموقع (إنجليزي)", name: "nameEn", widget: "string", hint: "مثل: Stream Master Pro" }
          - { label: "🌐 الدومين (بدون https://)", name: "domain", widget: "string", hint: "مثل: streammasterstore.com" }
          - { label: "🔗 رابط الموقع الكامل", name: "url", widget: "string", hint: "مثل: https://streammasterstore.com" }
          - { label: "📝 الوصف المختصر", name: "description", widget: "text", hint: "يستخدم في عدة أماكن في الموقع" }
          - { label: "✨ الشعار النصي", name: "tagline", widget: "string" }
          - { label: "📅 سنة التأسيس", name: "founded", widget: "number", value_type: "int", min: 2000, max: 2100 }
          - { label: "📍 عنوان الشركة", name: "address", widget: "string", hint: "مثل: الرياض، المملكة العربية السعودية" }

          # معلومات التواصل
          - label: "📞 رقم WhatsApp (مع كود الدولة +)"
            name: "whatsapp"
            widget: "string"
            hint: "مثال: +201098950879 (كود مصر +20، السعودية +966، الإمارات +971)"
          - label: "📞 رقم الهاتف العادي"
            name: "phone"
            widget: "string"
            hint: "نفس الرقم عادةً - مثال: +201098950879"
          - { label: "📧 البريد الإلكتروني للدعم", name: "email", widget: "string", hint: "مثل: support@example.com" }

          # روابط التواصل الاجتماعي
          - label: "🌐 روابط التواصل الاجتماعي (متداخلة)"
            name: "social"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Twitter / X", name: "twitter", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Telegram", name: "telegram", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }

          # إعدادات SEO
          - label: "🔍 إعدادات SEO الافتراضية (متداخلة)"
            name: "defaultSeo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "قالب العنوان", name: "titleTemplate", widget: "string", hint: "استخدم %s كعنوان الصفحة - مثل: %s | ستريم ماستر برو" }
              - { label: "العنوان الافتراضي", name: "defaultTitle", widget: "string" }
              - { label: "الوصف الافتراضي", name: "description", widget: "text" }
              - { label: "صورة Open Graph الافتراضية", name: "ogImage", widget: "string", required: false, hint: "مسار الصورة - مثل: /images/og-default.png" }
              - { label: "حساب Twitter", name: "twitterHandle", widget: "string" }
              - { label: "اللغة والمنطقة", name: "locale", widget: "string", hint: "مثل: ar_SA" }

          # OneSignal
          - label: "🔔 إعدادات الإشعارات (OneSignal)"
            name: "onesignal"
            widget: "object"
            collapsed: true
            fields:
              - { label: "App ID", name: "appId", widget: "string", hint: "من لوحة تحكم OneSignal" }

          # روابط التنقل
          - label: "🧭 روابط القائمة الرئيسية"
            name: "navLinks"
            widget: "list"
            collapsed: true
            hint: "الروابط التي تظهر في القائمة العلوية. أضف/احذف/رتّب كما تريد."
            fields:
              - { label: "المسار", name: "href", widget: "string", hint: "مثل: /blog/ (ينتهي بـ / دائمًا)" }
              - { label: "النص الظاهر", name: "label", widget: "string", hint: "مثل: المدوّنة" }

          # روابط الفوتر
          - label: "📋 روابط الفوتر (متداخلة)"
            name: "footerLinks"
            widget: "object"
            collapsed: true
            fields:
              - label: "المتجر"
                name: "shop"
                widget: "list"
                fields:
                  - { label: "المسار", name: "href", widget: "string" }
                  - { label: "النص", name: "label", widget: "string" }
              - label: "المساعدة"
                name: "help"
                widget: "list"
                fields:
                  - { label: "المسار", name: "href", widget: "string" }
                  - { label: "النص", name: "label", widget: "string" }
              - label: "قانوني"
                name: "legal"
                widget: "list"
                fields:
                  - { label: "المسار", name: "href", widget: "string" }
                  - { label: "النص", name: "label", widget: "string" }

  # ---------------------------------------------------------------------
  # 5. مباريات السلايدر الرئيسي (Hero)
  # ---------------------------------------------------------------------
  - name: "matches"
    label: "⚽ مباريات السلايدر"
    label_singular: "مباراة"
    description: "المباريات التي تظهر في السلايدر الرئيسي بالصفحة الأولى."
    files:
      - name: "matches"
        label: "قائمة المباريات"
        file: "src/data/matches.json"
        description: "رتّب المباريات بالسحب والإفلات. الأول يظهر أولاً."
        fields:
          - label: "المباريات"
            name: "matches"
            widget: "list"
            summary: "{{fields.homeTeam}} ضد {{fields.awayTeam}} — {{fields.status}}"
            fields:
              - { label: "🆔 المعرف (ID)", name: "id", widget: "number", value_type: "int", hint: "رقم فريد للمباراة - مثل: 1, 2, 3" }
              - { label: "🏷️ عنوان المباراة", name: "title", widget: "string", hint: "مثل: السعودية vs إسبانيا" }
              - { label: "📅 التاريخ", name: "date", widget: "string", hint: "مثل: 15 يونيو 2026 أو 'طوال الموسم'" }
              - { label: "🏆 البطولة", name: "tournament", widget: "string", hint: "مثل: كأس العالم 2026 أو beIN Sports" }
              - { label: "🖼️ صورة المباراة", name: "image", widget: "string", hint: "مسار الصورة - مثل: /images/matches/your-image.avif" }
              - { label: "🏠 الفريق الأول", name: "homeTeam", widget: "string", hint: "الفريق صاحب الأرض أو الأول" }
              - { label: "✈️ الفريق الثاني", name: "awayTeam", widget: "string", hint: "الفريق الضيف أو الثاني" }
              - { label: "🔢 نتيجة الأول", name: "homeScore", widget: "string", hint: "رقم أو نص - مثل: 2 أو ? (للمباريات القادمة)" }
              - { label: "🔢 نتيجة الثاني", name: "awayScore", widget: "string", hint: "رقم أو نص - مثل: 1 أو ? (للمباريات القادمة)" }
              - label: "🔴 حالة المباراة"
                name: "status"
                widget: "select"
                default: "upcoming"
                options:
                  - { label: "🔴 مباشر", value: "live" }
                  - { label: "🟡 قريباً (لم تبدأ)", value: "upcoming" }
                  - { label: "⚪ انتهت", value: "finished" }

# =============================================================================
# الإعدادات المتقدمة
# =============================================================================

# ملاحظة: locale محدد في الأعلى — لا تكرره هنا
search: true

# أوضاع المعاينة (Preview) - تظهر كزر في اللوحة
# تتطلب GitHub App أو Netlify Identity
# preview_path: "preview/{{slug}}"
