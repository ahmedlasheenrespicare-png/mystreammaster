<!doctype html>
<html lang="ar" dir="rtl" data-card="true">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>مجسّم السيرفر</title>
  <style>html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}#viewer{position:relative;width:100%;height:100%;touch-action:none}#viewer canvas{display:block;position:absolute;inset:0;width:100%;height:100%}#viewer-status{position:absolute;inset:0;display:grid;place-items:center;font:11px Tahoma,Arial;color:#aaa}#viewer-status[hidden],.controls{display:none}</style>
</head>
<body data-card="true" data-embedded="true">
  <div id="viewer" role="img" aria-label="مجسّم شعار السيرفر"><span id="viewer-status" role="status">جارٍ تحميل المجسّم</span></div>
  <div class="controls" hidden><button id="spin" type="button"></button><button id="zoom-in" type="button"></button><button id="zoom-out" type="button"></button><button id="reset" type="button"></button></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
