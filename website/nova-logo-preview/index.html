<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#100d17">
  <title>مجسّما نوفا وX | معاينة ستريم ماستر</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#100d17;color:#f9f2ee;font-family:Tahoma,Arial,sans-serif}.page{max-width:1600px;min-height:100dvh;margin:auto;padding:0 clamp(18px,4vw,60px)}header{height:90px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1a}.brand{font-size:20px;font-weight:900;color:white;text-decoration:none}.brand span{color:#dcff63}.brand small{display:block;font:700 8px Arial;letter-spacing:.2em;color:#aaa2aa;direction:ltr;margin-top:5px}.badge{border:1px solid #ffffff2c;color:#d7c3c7;border-radius:30px;padding:8px 13px;font-size:11px}.intro{display:flex;justify-content:space-between;align-items:end;gap:25px;padding:38px 0 24px}.eyebrow{font:700 10px Arial;letter-spacing:.2em;color:#c4a2ab;direction:ltr;text-align:right}.eyebrow span{color:#dcff63}.intro h1{font-size:clamp(31px,4vw,54px);margin:10px 0;color:#fff}.intro p{color:#bbaab2;font-size:14px;line-height:1.9;margin:0}.reset{white-space:nowrap;border:1px solid #ffffff35;border-radius:99px;padding:12px 18px;background:transparent;color:white;font:700 12px Tahoma,Arial;cursor:pointer}.reset:hover,.reset:focus-visible{color:#24131c;background:#e7ff94}.models{display:grid;grid-template-columns:1fr 1fr;gap:20px}.model{min-width:0;border:1px solid #ffffff22;border-radius:24px;overflow:hidden;background:#1b111a}.model h2{display:flex;justify-content:space-between;align-items:center;margin:0;padding:18px 24px;border-bottom:1px solid #ffffff15;font-size:16px}.model h2 span{font:700 10px Arial;color:#a99aa2;letter-spacing:.13em;direction:ltr}.model iframe{display:block;width:100%;height:670px;border:0;background:#1b111a}.model.x iframe{background:#1d1015}footer{display:flex;justify-content:space-between;gap:15px;padding:24px 0;color:#897983;font-size:11px}@media(max-width:760px){header{height:74px}.intro{align-items:start;flex-direction:column;padding:28px 0 20px;gap:16px}.models{grid-template-columns:1fr;gap:16px}.model iframe{height:590px}footer{font-size:10px}}
  </style>
</head>
<body><main class="page">
  <header><a class="brand" href="/" aria-label="ستريم ماستر - الصفحة الرئيسية">ستريم <span>ماستر</span><small>STREAM MASTER PRO</small></a><span class="badge">✦ معاينة مستقلة</span></header>
  <div class="intro"><div><div class="eyebrow"><span>01 /</span> SERVER IDENTITIES</div><h1>نوفا و X، ببُعد جديد.</h1><p>استكشف المجسّمين جنبًا إلى جنب. لكل شعار مساحة وتحكّم مستقل.</p></div><button class="reset" id="reset-both" type="button">↺ إعادة عرض المجسّمين</button></div>
  <section class="models" aria-label="مجسّما السيرفرين">
    <article class="model"><h2>نوفا <span>NOVA SERVER / 3D</span></h2><iframe id="nova-frame" title="مجسّم نوفا التفاعلي" src="./model.html?logo=nova&amp;embed=1"></iframe></article>
    <article class="model x"><h2>سيرفر X <span>X SERVER / 3D</span></h2><iframe id="x-frame" title="مجسّم سيرفر X التفاعلي" loading="lazy"></iframe></article>
  </section><footer><span>إعادة رسم لشعارات السيرفرات · تجربة ثلاثية الأبعاد</span><span>STREAM MASTER PRO ©</span></footer>
</main><script>
(() => {
  const nova = document.querySelector('#nova-frame'), x = document.querySelector('#x-frame');
  let started = false, timer;
  const launchX = () => { if (started) return; started = true; clearTimeout(timer); x.src = './model.html?logo=x&embed=1'; };
  function scheduleFallback() { clearTimeout(timer); timer = setTimeout(launchX, 8000); }
  window.addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== nova.contentWindow || event.data !== 'nova-entrance-complete' || started) return;
    clearTimeout(timer);
    timer = setTimeout(launchX, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 250);
  });
  document.querySelector('#reset-both').addEventListener('click', () => {
    started = false; clearTimeout(timer); x.removeAttribute('src');
    nova.src = './model.html?logo=nova&embed=1'; scheduleFallback();
  });
  scheduleFallback();
})();
</script></body></html>
