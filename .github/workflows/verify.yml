name: Verify storefront
on:
  pull_request:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # حارس وقائي: علامات تعارض دمج غير محلولة وصلت إلى main عبر PR #71
      # (18 أكتوبر 2026) وكسرت النشر؛ نرفض أي شجرة تحملها قبل أي فحص آخر.
      - name: Reject unresolved merge conflict markers
        run: |
          if grep -RInE '^(<<<<<<< |=======$|>>>>>>> )' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=dist-ssr . ; then
            echo '::error::Unresolved merge conflict markers found in the tree (matches listed above). Resolve them before merging.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm ci --prefix tests/source-store
      - run: npm test --prefix tests/source-store
      - run: npm run typecheck
      - run: npm test
      # الحارس الصارم دائم: أي عنوان بلا كلمته أو أطول من 60 حرفاً يُفشل البناء
      - run: npm run build
        env:
          SEO_STRICT: '1'
      - run: npm run test:ui
