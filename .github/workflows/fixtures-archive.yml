name: Daily fixtures archive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/fixtures-archive.yml'
      - 'website/scripts/probe-saudi-fixtures.mjs'
      - 'website/scripts/probe-espn-summary.mjs'
permissions:
  contents: read
concurrency:
  group: fixtures-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe-saudi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node website/scripts/probe-saudi-fixtures.mjs
      - run: node website/scripts/probe-espn-summary.mjs
      - name: Report approval & operational readiness state (no secret values)
        env:
          FIXTURES_SOURCES_APPROVED: ${{ vars.FIXTURES_SOURCES_APPROVED }}
          HIGHLIGHTLY_PLAN_APPROVED: ${{ vars.HIGHLIGHTLY_PLAN_APPROVED }}
          FIXTURES_STATISTICS: ${{ vars.FIXTURES_STATISTICS }}
          HAS_HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY != '' }}
        run: |
          node -e '
            const state = {
              checkedAt: new Date().toISOString(),
              vars: {
                FIXTURES_SOURCES_APPROVED: process.env.FIXTURES_SOURCES_APPROVED || "(unset)",
                HIGHLIGHTLY_PLAN_APPROVED: process.env.HIGHLIGHTLY_PLAN_APPROVED || "(unset)",
                FIXTURES_STATISTICS: process.env.FIXTURES_STATISTICS || "(unset)",
              },
              secrets: {
                HIGHLIGHTLY_API_KEY_CONFIGURED: process.env.HAS_HIGHLIGHTLY_KEY === "true",
              },
            };
            console.log("::notice title=Archive operational variables state::" + JSON.stringify(state));
          '
      - run: |
          echo '### Read-only Saudi fixture identity & ESPN summary probes (not production approval)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat website/.fixtures-out/saudi-probe.json >> "$GITHUB_STEP_SUMMARY"
          cat website/.fixtures-out/espn-summary-probe.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: saudi-fixture-identity
          path: |
            website/.fixtures-out/saudi-probe.json
            website/.fixtures-out/espn-summary-probe.json
          include-hidden-files: true
          retention-days: 7
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test website/scripts/test-fixtures-archive.mjs
      - name: Collect sequentially (failures preserve last success)
        id: fetch
        continue-on-error: true
        env:
          FIXTURES_SOURCES_APPROVED: ${{ vars.FIXTURES_SOURCES_APPROVED }}
          HIGHLIGHTLY_PLAN_APPROVED: ${{ vars.HIGHLIGHTLY_PLAN_APPROVED }}
          FIXTURES_STATISTICS: ${{ vars.FIXTURES_STATISTICS }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
        run: node website/scripts/fetch-fixtures-archive.mjs
      - name: Report source failures
        if: always()
        run: |
          if [ -f website/.fixtures-out/report.json ]; then
            echo '### Fixtures archive: failed leagues retain their previous files' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat website/.fixtures-out/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: fixtures-candidate
          path: website/.fixtures-out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Mark partial failures visibly
        if: steps.fetch.outcome == 'failure'
        run: echo '::warning::One or more leagues failed; see report.json. Successful leagues may still publish.'
  publish:
    needs: collect
    if: needs.collect.outputs.ready != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      committed_at: ${{ steps.commit.outputs.committed_at }}
      last_fetched_at: ${{ steps.commit.outputs.last_fetched_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: fixtures-candidate
          path: website/.fixtures-out/
      - name: Reject stale checkout
        env:
          COLLECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COLLECTED_SHA"
      - name: Revalidate and publish only archive files
        id: commit
        run: |
          set -euo pipefail
          node website/scripts/publish-fixtures-archive.mjs > /tmp/publish-result.json
          cat /tmp/publish-result.json
          node --test website/scripts/test-fixtures-archive.mjs
          last_fetched_at="$(node -e 'const r = JSON.parse(require("fs").readFileSync("/tmp/publish-result.json", "utf8")); process.stdout.write(r.lastFetchedAt || "");')"
          echo "last_fetched_at=${last_fetched_at}" >> "$GITHUB_OUTPUT"
          git add -- website/src/content/fixtures-archive
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No semantic changes; no commit or deploy.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified fixtures archive [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          commit_sha="$(git rev-parse HEAD)"
          committed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "committed_at=${committed_at}" >> "$GITHUB_OUTPUT"
          echo "Committed ${commit_sha} at ${committed_at} (lastFetchedAt=${last_fetched_at})." >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      archive_fetched_at: ${{ needs.publish.outputs.last_fetched_at }}
    secrets: inherit
