name: Deploy to Hostinger
on:
  push:
    branches: [main]
  # "Run workflow" button in the Actions tab: redeploys the current tip of main.
  workflow_dispatch:
  # Triggered by fixtures-archive.yml when verified archive JSON files actually change on main.
  workflow_call:
    inputs:
      archive_fetched_at:
        description: 'Latest archive fetchedAt UTC timestamp when triggered by fixtures-archive.yml'
        required: false
        default: ''
        type: string

# Production must never move backwards. GitHub can deliver a push event late or
# twice: on 2026-10-14 a duplicate event for an older merge (481990a) started
# after the deploy of the newer main (0f79375) and uploaded the older build over
# it, silently reverting the Event JSON-LD fix. So deploys are serialized here
# (a running FTP sync is never cancelled midway), and every run deploys the
# *current* tip of main rather than the commit that triggered it. A pending run
# that GitHub replaces with a newer one is therefore harmless.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Report deployed commit
        run: |
          deployed="$(git rev-parse HEAD)"
          echo "Deploying main@${deployed} (run triggered by ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "::notice title=Deploying latest main::Triggered by ${GITHUB_SHA:0:7}, but main is now at ${deployed:0:7}; deploying the latest main so production never rolls back."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run typecheck && npm test && npm run build
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./
          # Only repo tooling is excluded here, plus the one path that cannot be
          # written over FTP.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            website/**
            tests/**
            node_modules/**
            package*.json
            README.md
            .nojekyll
            clicks.json
            # مسار عالق غير قابل للكتابة عبر FTP (ECONNRESET / 550 Permission
            # denied على Hostinger)، ونُقلت المكتبة إلى php-lib. يُستبعد
            # lib/.htaccess صراحةً — إلى جانب استثناء lib/** العام — حتى يبقى
            # رفع FTP سليماً حتى لو ضُيّق الاستثناء العام مستقبلاً.
            lib/.htaccess
            lib/**
      - name: Report archive-to-deploy freshness
        env:
          ARCHIVE_FETCHED_AT: ${{ inputs.archive_fetched_at }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs/promises";
            import path from "node:path";
            import { buildArchiveDeployReport } from "./website/scripts/publish-fixtures-archive.mjs";

            let lastFetchedAt = process.env.ARCHIVE_FETCHED_AT || "";
            if (!lastFetchedAt) {
              const root = "website/src/content/fixtures-archive";
              const entries = await fs.readdir(root, { withFileTypes: true }).catch(() => []);
              for (const d of entries) {
                if (!d.isDirectory()) continue;
                const files = await fs.readdir(path.join(root, d.name)).catch(() => []);
                for (const f of files) {
                  if (!f.endsWith(".json")) continue;
                  const data = JSON.parse(await fs.readFile(path.join(root, d.name, f), "utf8"));
                  for (const m of data.matches || []) {
                    if (!lastFetchedAt || Date.parse(m.fetchedAt) > Date.parse(lastFetchedAt)) {
                      lastFetchedAt = m.fetchedAt;
                    }
                  }
                }
              }
            }
            const report = buildArchiveDeployReport({
              lastFetchedAt: lastFetchedAt || null,
              deployedAt: new Date().toISOString(),
              changedFiles: lastFetchedAt ? 1 : 0,
              commitSha: process.env.GITHUB_SHA || null,
            });
            console.log("::notice title=Archive deploy freshness::" + JSON.stringify(report));
          '
