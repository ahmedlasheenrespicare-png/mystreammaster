name: Daily fixtures archive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      league:
        description: 'استرجاع بطولة واحدة فقط (فارغ = كل البطولات الاثنتي عشرة)'
        required: false
        default: ''
      window_from:
        description: 'بداية نافذة الاسترجاع YYYY-MM-DD (فارغ = النافذة المتحركة 45 يوماً)'
        required: false
        default: ''
      window_to:
        description: 'نهاية نافذة الاسترجاع YYYY-MM-DD'
        required: false
        default: ''
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/fixtures-archive.yml'
      - 'website/scripts/probe-saudi-fixtures.mjs'
      - 'website/scripts/probe-espn-summary.mjs'
      - 'website/scripts/probe-match-lineups.mjs'
      - 'website/scripts/fetch-fixtures-archive.mjs'
      - 'website/.fixtures-backfill-request.json'
permissions:
  contents: read
concurrency:
  group: fixtures-archive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe-saudi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node website/scripts/probe-saudi-fixtures.mjs
      - run: node website/scripts/probe-espn-summary.mjs
      - run: node website/scripts/probe-match-lineups.mjs
      - name: Report approval & operational readiness state (no secret values)
        env:
          FIXTURES_SOURCES_APPROVED: ${{ vars.FIXTURES_SOURCES_APPROVED }}
          HIGHLIGHTLY_PLAN_APPROVED: ${{ vars.HIGHLIGHTLY_PLAN_APPROVED }}
          FIXTURES_STATISTICS: ${{ vars.FIXTURES_STATISTICS }}
          HAS_HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY != '' }}
        run: |
          node -e '
            const state = {
              checkedAt: new Date().toISOString(),
              vars: {
                FIXTURES_SOURCES_APPROVED: process.env.FIXTURES_SOURCES_APPROVED || "(unset)",
                HIGHLIGHTLY_PLAN_APPROVED: process.env.HIGHLIGHTLY_PLAN_APPROVED || "(unset)",
                FIXTURES_STATISTICS: process.env.FIXTURES_STATISTICS || "(unset)",
              },
              secrets: {
                HIGHLIGHTLY_API_KEY_CONFIGURED: process.env.HAS_HIGHLIGHTLY_KEY === "true",
              },
            };
            console.log("::notice title=Archive operational variables state::" + JSON.stringify(state));
          '
      - run: |
          echo '### Read-only Saudi fixture identity & ESPN summary probes (not production approval)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat website/.fixtures-out/saudi-probe.json >> "$GITHUB_STEP_SUMMARY"
          cat website/.fixtures-out/espn-summary-probe.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: saudi-fixture-identity
          path: |
            website/.fixtures-out/saudi-probe.json
            website/.fixtures-out/espn-summary-probe.json
            website/.fixtures-out/lineups-probe.json
          include-hidden-files: true
          retention-days: 7
  collect:
    # التشغيل الآلي المعتاد (schedule/dispatch) دائماً، وعلى الدفع
    # فقط حين تحمل رسالة الالتزام علامة [fixtures-backfill] ويُرتَّك
    # معها ملف الطلب — لا جمع ضمني على أي دفع آخر أبداً.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fixtures-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test website/scripts/test-fixtures-archive.mjs
      - name: Determine collection mode (dispatch inputs or committed backfill request)
        id: mode
        run: |
          set -euo pipefail
          field() { node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(r[process.argv[2]]??""))' "$1" "$2"; }
          if [ "${{ github.event_name }}" = "push" ]; then
            req="website/.fixtures-backfill-request.json"
            test -f "$req" || { echo "::error::backfill marker without a request file"; exit 1; }
            echo "league=$(field "$req" league)" >> "$GITHUB_OUTPUT"
            echo "from=$(field "$req" window_from)" >> "$GITHUB_OUTPUT"
            echo "to=$(field "$req" window_to)" >> "$GITHUB_OUTPUT"
          else
            echo "league=${{ github.event.inputs.league }}" >> "$GITHUB_OUTPUT"
            echo "from=${{ github.event.inputs.window_from }}" >> "$GITHUB_OUTPUT"
            echo "to=${{ github.event.inputs.window_to }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect sequentially (failures preserve last success)
        id: fetch
        continue-on-error: true
        env:
          FIXTURES_SOURCES_APPROVED: ${{ vars.FIXTURES_SOURCES_APPROVED }}
          HIGHLIGHTLY_PLAN_APPROVED: ${{ vars.HIGHLIGHTLY_PLAN_APPROVED }}
          FIXTURES_STATISTICS: ${{ vars.FIXTURES_STATISTICS }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          FIXTURES_BACKFILL_LEAGUE: ${{ steps.mode.outputs.league }}
          FIXTURES_WINDOW_FROM: ${{ steps.mode.outputs.from }}
          FIXTURES_WINDOW_TO: ${{ steps.mode.outputs.to }}
        run: node website/scripts/fetch-fixtures-archive.mjs
      - name: Emit compact collection metrics
        if: always()
        run: |
          if [ -f website/.fixtures-out/report.json ]; then
            node -e 'const r=JSON.parse(require("fs").readFileSync("website/.fixtures-out/report.json","utf8"));const ita=r.leagues.find(x=>x.league==="ita.1");console.log("::notice title=Fixtures archive report::"+JSON.stringify({window:r.window,ita1:ita?{ok:ita.ok,code:ita.code??null,matchesInWindow:ita.matchesInWindow??null}:null,statisticsFailures:r.statisticsFailures,requests:r.requests}));'
          fi
      - name: Report source failures
        if: always()
        run: |
          if [ -f website/.fixtures-out/report.json ]; then
            echo '### Fixtures archive: failed leagues retain their previous files' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat website/.fixtures-out/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: fixtures-candidate
          path: website/.fixtures-out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Mark partial failures visibly
        if: steps.fetch.outcome == 'failure'
        run: echo '::warning::One or more leagues failed; see report.json. Successful leagues may still publish.'
  publish:
    needs: collect
    if: needs.collect.outputs.ready != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      committed_at: ${{ steps.commit.outputs.committed_at }}
      last_fetched_at: ${{ steps.commit.outputs.last_fetched_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: fixtures-candidate
          path: website/.fixtures-out/
      - name: Reject stale checkout
        env:
          COLLECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COLLECTED_SHA"
      - name: Revalidate and publish only archive files
        id: commit
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error title=Fixtures publication failed::line ${LINENO}, command ${BASH_COMMAND} (exit ${status})"; exit "$status"' ERR
          if ! node website/scripts/publish-fixtures-archive.mjs > /tmp/publish-result.json 2>/tmp/publish-error.log; then
            cat /tmp/publish-error.log
            error="$(tail -c 1200 /tmp/publish-error.log | tr '\n' ' ')"
            echo "::error title=Archive validation failed::${error}"
            exit 1
          fi
          cat /tmp/publish-result.json
          # أعد بناء المشتقات قبل اختبارات التحقق من تزامنها مع الأرشيف الجديد.
          node website/scripts/build-league-averages.mjs
          node --test website/scripts/test-fixtures-archive.mjs
          last_fetched_at="$(node -e 'const r = JSON.parse(require("fs").readFileSync("/tmp/publish-result.json", "utf8")); process.stdout.write(r.lastFetchedAt || "");')"
          echo "last_fetched_at=${last_fetched_at}" >> "$GITHUB_OUTPUT"
          git add -- website/src/content/fixtures-archive website/src/content/league-averages.json
          # طلب الاسترجاع الموسمي يُستهلك مع النشر — لا يبقى مطلوباً مفتوحاً.
          # git rm --ignore-unmatch ينجح حتى لو لم يكن الملف موجوداً أصلاً
          # (كما في التشغيل المجدول اليومي)، بعكس git add الذي يفشل بـ exit 128.
          git rm -f --ignore-unmatch -- website/.fixtures-backfill-request.json
          rm -f website/.fixtures-backfill-request.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'No semantic changes; no commit or deploy.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update verified fixtures archive [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          commit_sha="$(git rev-parse HEAD)"
          committed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "committed_at=${committed_at}" >> "$GITHUB_OUTPUT"
          echo "Committed ${commit_sha} at ${committed_at} (lastFetchedAt=${last_fetched_at})." >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      archive_fetched_at: ${{ needs.publish.outputs.last_fetched_at }}
    secrets: inherit
